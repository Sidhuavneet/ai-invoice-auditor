# Auto-deploys every push to main to the HuggingFace Space.
#
# Requires two GitHub repo secrets (Settings → Secrets and variables → Actions):
#   - HF_USERNAME  : your HuggingFace username
#   - HF_TOKEN     : a write-access token from huggingface.co/settings/tokens
#
# The Space must already exist with name "ai-invoice-auditor". To rename,
# edit HF_SPACE_NAME below.

name: Sync to HuggingFace Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — HF needs it for force-push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ai-invoice-auditor
        run: |
          git push "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" main --force
