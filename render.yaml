services:
  - type: web
    name: ai-invoice-auditor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_REASON_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: auditor-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
